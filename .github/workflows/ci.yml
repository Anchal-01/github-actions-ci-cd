name: CI Pipeline using GitHub Actions

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run shell script
        run: |
          echo "Running CI pipeline"
          uname -a

      - name: Build Docker image
        run: docker build -t demo-app:latest .

